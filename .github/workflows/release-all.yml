name: Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional version tag to publish (for example v2.0.0)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Collect Android APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Minido-Android.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: Minido-Android.apk
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Package Web
        shell: bash
        run: |
          cd build/web
          zip -qr ../../Minido-Web.zip .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: Minido-Web.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Minido-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Minido-Windows.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          tar -czf Minido-Linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: Minido-Linux.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS
        run: |
          ditto build/macos/Build/Products/Release/minido.app Minido.app
          ditto -c -k --sequesterRsrc --keepParent Minido.app Minido-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Minido-macOS.zip
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS IPA
        run: |
          mkdir -p Payload
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc Payload Minido-iOS-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: Minido-iOS-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build-android, build-web, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
