name: Multi-OS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional version tag to publish (for example v1.0.4)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm dpkg-dev elfutils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Linux
        run: flutter build linux --release

      - name: Build WebAssembly PWA
        run: flutter build web --wasm

      - name: Package Linux, Web, Debian, RPM, and Arch artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version v$version" >&2
            exit 1
          fi
          if [[ -n "${RELEASE_TAG:-}" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Requested release tag $RELEASE_TAG does not match pubspec version v$version" >&2
            exit 1
          fi
          stage="$RUNNER_TEMP/minido-stage"
          deb="$RUNNER_TEMP/minido-deb"
          rpm_root="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$stage/Minido-Linux-x64" "$deb/DEBIAN" \
            "$deb/opt/minido" "$deb/usr/share/applications" \
            "$deb/usr/share/icons/hicolor/512x512/apps" \
            "$rpm_root/BUILD" "$rpm_root/BUILDROOT" "$rpm_root/RPMS/x86_64" \
            "$rpm_root/SOURCES" "$rpm_root/SPECS" "$rpm_root/SRPMS"
          cp -a build/linux/x64/release/bundle/. "$stage/Minido-Linux-x64/"
          cp "$stage/Minido-Linux-x64/data/flutter_assets/assets/brand/minido_logo.png" \
            "$deb/usr/share/icons/hicolor/512x512/apps/minido.png"
          cp packaging/linux/minido.desktop "$deb/usr/share/applications/minido.desktop"
          cp -a "$stage/Minido-Linux-x64/." "$deb/opt/minido/"
          sed "s/@APP_VERSION@/$version/" packaging/linux/control > "$deb/DEBIAN/control"
          chmod 0755 "$deb/DEBIAN"

          tar -czf Minido-Linux-x64.tar.gz -C "$stage" Minido-Linux-x64
          dpkg-deb --build --root-owner-group "$deb" minido_amd64.deb

          cp Minido-Linux-x64.tar.gz "$rpm_root/SOURCES/"
          cp packaging/linux/minido.desktop "$rpm_root/SOURCES/"
          cp "$stage/Minido-Linux-x64/data/flutter_assets/assets/brand/minido_logo.png" \
            "$rpm_root/SOURCES/minido.png"
          sed "s/@APP_VERSION@/$version/" packaging/linux/minido.spec > "$rpm_root/SPECS/minido.spec"
          rpmbuild -bb --define "_topdir $rpm_root" "$rpm_root/SPECS/minido.spec"
          cp "$rpm_root/RPMS/x86_64/"minido-"$version"-1.x86_64.rpm minido-x86_64.rpm

          checksum="$(sha256sum Minido-Linux-x64.tar.gz | cut -d ' ' -f 1)"
          sed -e "s|@APP_VERSION@|$version|g" \
            -e "s|@REPOSITORY@|$GITHUB_REPOSITORY|g" \
            -e "s|@APP_SHA256@|$checksum|g" \
            packaging/linux/PKGBUILD.in > PKGBUILD

          mkdir -p dist
          cp Minido-Linux-x64.tar.gz minido_amd64.deb minido-x86_64.rpm PKGBUILD dist/
          cp -R build/web Minido-web-wasm
          zip -qr Minido-web-wasm.zip Minido-web-wasm
          cp Minido-web-wasm.zip dist/

      - name: Upload Linux and Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-web-release
          path: dist/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Package Android symbols
        run: zip -qr Minido-Android-symbols.zip build/app/outputs/symbols

      - name: Collect Android release files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*-release.apk dist/
          cp Minido-Android-symbols.zip dist/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          cp -R build/macos/Build/Products/Release/Runner.app Minido.app
          ditto -c -k --sequesterRsrc --keepParent \
            Minido.app Minido-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: Minido-macOS.zip
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc Payload Minido-iOS-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: Minido-iOS-unsigned.ipa
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Minido-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Minido-Windows-x64.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build-linux, build-android, build-macos, build-ios, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
