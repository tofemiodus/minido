<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline-first personal task manager with zero backend">
  <meta name="theme-color" content="#5269D8">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Minido">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Minido</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.__minidoDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.__minidoDeferredPrompt = event;
      window.dispatchEvent(new Event('minido-install-available'));
    });
    window.addEventListener('appinstalled', () => {
      window.__minidoDeferredPrompt = null;
      window.dispatchEvent(new Event('minido-app-installed'));
    });
    window.minidoPromptInstall = async () => {
      const prompt = window.__minidoDeferredPrompt;
      if (!prompt) return 'unavailable';
      prompt.prompt();
      const choice = await prompt.userChoice;
      window.__minidoDeferredPrompt = null;
      return choice.outcome === 'accepted' ? 'accepted' : 'dismissed';
    };
    window.canPromptInstall = () => window.__minidoDeferredPrompt !== null;
    window.triggerInstallPrompt = () => window.minidoPromptInstall();
    window.isStandalonePwa = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    window.isIosSafari = () => {
      const ua = navigator.userAgent || '';
      const platform = navigator.platform || '';
      const isIosDevice =
        /iPad|iPhone|iPod/.test(ua) ||
        (platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAlternateBrowser = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
      return isIosDevice && /Safari/.test(ua) && !isAlternateBrowser;
    };

    window.persistStorage = async () => {
      if (!navigator.storage || !navigator.storage.persist) return false;
      try {
        return await navigator.storage.persist();
      } catch (_) {
        return false;
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
